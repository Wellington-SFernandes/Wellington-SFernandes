<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .web { fill: none; stroke: #00ff88; stroke-width: 1; opacity: 0.3; }
      .level {
        fill: #00ff88;
        fill-opacity: 0.2;
        stroke: #00ff88;
        stroke-width: 2;
        animation: pulse 2s infinite;
      }
      .label {
        fill: #00ff88;
        font-family: monospace;
        font-size: 12px;
        text-anchor: middle;
      }
      @keyframes pulse {
        0% { fill-opacity: 0.2; }
        50% { fill-opacity: 0.5; }
        100% { fill-opacity: 0.2; }
      }
    </style>
  </defs>

  <circle cx="200" cy="200" r="150" class="web"/>
  <circle cx="200" cy="200" r="110" class="web"/>
  <circle cx="200" cy="200" r="70" class="web"/>
  <circle cx="200" cy="200" r="30" class="web"/>

  <line x1="200" y1="50" x2="200" y2="350" class="web"/>
  <line x1="50" y1="200" x2="350" y2="200" class="web"/>
  <line x1="90" y1="90" x2="310" y2="310" class="web"/>
  <line x1="310" y1="90" x2="90" y2="310" class="web"/>

  <polygon class="level"
    points="
      200,70
      270,120
      300,200
      200,300
      100,200
      130,120
    "
  />

  <text x="200" y="40" class="label">Kali</text>
  <text x="300" y="110" class="label">Python</text>
  <text x="340" y="205" class="label">Nmap</text>
  <text x="200" y="360" class="label">Metasploit</text>
  <text x="60" y="205" class="label">Enum</text>
  <text x="100" y="110" class="label">Pentest</text>
</svg>